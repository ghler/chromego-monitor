name: Update ChromeGo Configs & Subscriptions

on:
  # Manual trigger anytime
  workflow_dispatch:

  # Automatic: once a month (1st day of every month at 00:00 UTC)
  schedule:
    - cron: '0 0 17 * *'

permissions:
  contents: write   # needed to push changes

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Needed so we can push later
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor + generate subscriptions
        run: |
          python monitor.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add configs/ history/ state/ subscriptions/
          
          git commit -m "chore: update configs and subscriptions $(date -u +'%Y-%m-%d')"
          git push
